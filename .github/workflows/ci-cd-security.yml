name: CI/CD Security Demo

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  security-events: write
  id-token: write

jobs:
  scan-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Run Microsoft Security DevOps
        uses: microsoft/security-devops-action@latest
        id: msdo
        with:
          categories: IaC

      - name: Upload MSDO SARIF to GitHub Code Scanning
        if: ${{ always() && steps.msdo.outputs.sarifFile != '' }}
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: ${{ steps.msdo.outputs.sarifFile }}
          category: microsoft-security-devops

      - name: Save MSDO SARIF as an artifact
        if: ${{ always() && steps.msdo.outputs.sarifFile != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: msdo-sarif-results
          path: ${{ steps.msdo.outputs.sarifFile }}
          if-no-files-found: warn

      - name: Check whether Azure credentials are configured
        id: azure-creds
        env:
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
        run: |
          if [ -n "$AZURE_CLIENT_ID" ] && [ -n "$AZURE_TENANT_ID" ] && [ -n "$AZURE_SUBSCRIPTION_ID" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::notice::AZURE_CLIENT_ID, AZURE_TENANT_ID and/or AZURE_SUBSCRIPTION_ID are not set. Skipping Azure login and deployment. See README.md for setup instructions."
          fi

      - name: Sign in to Azure with OIDC
        if: steps.azure-creds.outputs.configured == 'true'
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy the Bicep template
        if: steps.azure-creds.outputs.configured == 'true'
        uses: azure/arm-deploy@v2
        with:
          resourceGroupName: ${{ vars.AZURE_RESOURCE_GROUP || 'demo-rg' }}
          template: infra/main.bicep
